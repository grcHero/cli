name: Release
# Builds the files the one-line installer downloads. Tag vX.Y.Z (matching
# grchero_cli.__version__) or run by hand. The deployment's public sign-in values come
# from repository variables, never secrets: none of them is secret. The grcHero
# repository publishes the result at grchero.dev/cli (infra/scripts/publish_cli_release.sh).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        # Ubuntu 22.04 keeps the Linux program compatible with older glibc.
        os: [ubuntu-22.04, macos-13, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - name: Write sign-in values
        shell: python
        env:
          API_URL: ${{ vars.GRCHERO_API_URL }}
          ISSUER_URL: ${{ vars.GRCHERO_ISSUER_URL }}
          CLIENT_ID: ${{ vars.GRCHERO_CLIENT_ID }}
          AUDIENCE: ${{ vars.GRCHERO_AUDIENCE }}
        run: |
          import json, os
          json.dump({key: os.environ[name] for key, name in (("api_url", "API_URL"), ("issuer_url", "ISSUER_URL"), ("client_id", "CLIENT_ID"), ("audience", "AUDIENCE"))}, open("deployment.json", "w"))
      - run: python scripts/build_release.py --native --deployment deployment.json --out out
      - run: python -c "import glob, subprocess; subprocess.run([glob.glob('out/grchero-*')[0], 'doctor'], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: out/grchero-*
  collect:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: natives
          merge-multiple: true
      - name: Write sign-in values
        shell: python
        env:
          API_URL: ${{ vars.GRCHERO_API_URL }}
          ISSUER_URL: ${{ vars.GRCHERO_ISSUER_URL }}
          CLIENT_ID: ${{ vars.GRCHERO_CLIENT_ID }}
          AUDIENCE: ${{ vars.GRCHERO_AUDIENCE }}
        run: |
          import json, os
          json.dump({key: os.environ[name] for key, name in (("api_url", "API_URL"), ("issuer_url", "ISSUER_URL"), ("client_id", "CLIENT_ID"), ("audience", "AUDIENCE"))}, open("deployment.json", "w"))
      - run: |
          args=""
          for file in natives/grchero-*; do args="$args --include $file"; done
          chmod +x natives/grchero-*
          python scripts/build_release.py --deployment deployment.json --out release $args
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --title "$GITHUB_REF_NAME"
