[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grchero-cli"
version = "0.1.0"
description = "Local, scoped security reviews for grcHero"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[project.urls]
Repository = "https://github.com/grcHero/grchero-cli"
Issues = "https://github.com/grcHero/grchero-cli/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[project.scripts]
grchero = "grchero_cli.main:main"

[tool.setuptools.packages.find]
include = ["grchero_cli*"]

[tool.setuptools.package-data]
grchero_cli = ["py.typed"]
